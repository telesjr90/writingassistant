    "current_parent_task_title": "Writer Assistant Core candidate review queue and persistence gate planning",
    "frontier_note": "PHASE8-IMPL-011 is active as the eleventh Writer Assistant Core parent after completed PHASE8-IMPL-010 (complete through PHASE8-IMPL-010-T007). PHASE8-IMPL-011-T001 published the candidate review queue and persistence gate planning parent. PHASE8-IMPL-011-T002 is complete and accepted the candidate draft to candidate record persistence gate decision at docs/roadmap/decisions/PHASE8-IMPL-011-candidate-draft-to-record-persistence-gate-decision.md. PHASE8-IMPL-011-T003 is complete and accepted the review queue data shape and lifecycle decision at docs/roadmap/decisions/PHASE8-IMPL-011-review-queue-data-shape-lifecycle-decision.md. Future queue entries are workflow support only, queue presence is non-approval, lifecycle states are review workflow states only, evidence/provenance/source locator display is mandatory, insufficient-evidence and rejected-output handling must be explicit, grouping/sorting/filtering are workflow convenience only, and owner action labels are future planning terms only. PHASE8-IMPL-011-T004 is complete and added expected-red candidate persistence gate contract tests at tests/test_writer_assistant_core_candidate_review_gate_contract.py for the future backend.story_knowledge.candidate_review_gate module and its validate_candidate_draft_for_persistence, build_candidate_record_from_draft, build_review_queue_entry, and persist_candidate_record_for_review APIs; the target pytest is expected-red with a collection ImportError limited to the missing future module, and candidate/orchestrator/source-evidence/OMI/project regressions pass. PHASE8-IMPL-011-T005 (minimal candidate persistence gate helper, if authorized) is ready/active; PHASE8-IMPL-011-T006 and PHASE8-IMPL-011-T007 are planned. T001/T002/T003/T004 added no candidate persistence, no candidate review gate implementation, no candidate review queue implementation, no candidate review UI/API, no backend routes, no frontend UI, no apply-promotion, no memory/canon mutation, no runtime extraction, no real BookNLP/spaCy install or run, no package/dependency changes, no generated prose, and no training/JSONL/dataset work. Candidate drafts remain in-memory review support only and owner review remains mandatory before anything can become approved truth."
